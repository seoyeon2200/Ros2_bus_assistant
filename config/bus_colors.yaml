# 버스 색상 HSV 범위 설정
# OpenCV HSV: H(0-180), S(0-255), V(0-255)
bus_colors:
  red:
    ranges:
      - lower: [0,   120,  70]
        upper: [10,  255, 255]
      - lower: [170, 120,  70]   # 빨강은 0/180 경계를 걸침
        upper: [180, 255, 255]
    stop_position: {x: 3.0, y: 0.0, yaw_deg: 0.0}

  blue:
    ranges:
      - lower: [100, 100,  50]
        upper: [130, 255, 255]
    stop_position: {x: 3.0, y: 2.0, yaw_deg: 90.0}

  green:
    ranges:
      - lower: [40,  60,  50]
        upper: [80, 255, 255]
    stop_position: {x: 0.0, y: 3.0, yaw_deg: 180.0}

  yellow:
    ranges:
      - lower: [20, 100, 100]
        upper: [35, 255, 255]
    stop_position: {x: -2.0, y: 0.0, yaw_deg: 270.0}

# 인식 최소 픽셀 면적
min_area: 3000
